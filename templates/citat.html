<body style="background-color: #bdddfc; font-family: Verdana, sans-serif;" class="text-black text-center">

   <a href="/citat"><button class="btn btn-outline-dark">Zobrazit citát</button></a>

   <p id="citat">{{ citat }}</p>

   <form method="POST">

    </form>
